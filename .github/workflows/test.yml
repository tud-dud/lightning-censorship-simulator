name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: ⚙ Install stable toolchain and compile
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo build --release
